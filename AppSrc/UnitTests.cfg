; UnitTests.cfg - project settings for the DFUnit test program.
;
; Platform=x64, as the demo itself. The program is UnitTests64.exe.
; The manifest is a fixed file in the repository, UnitTests64.exe.manifest, and it is embedded
; (EmbedManifestFile=1) but never written (BuildManifestFile=0). df-cli does not write a manifest,
; so a written one would be missing on a build server ("manifest file cannot be found"); a fixed
; one is there for the Studio and df-cli alike. It asks for the new common controls, so the
; test-runner window looks like any other program. The program uses no COM controls, so the file
; never needs to change.
; Icon is the icon of the program file. The test-runner window brings its own images.
[Application]
IsWebApp=0
BuildManifestFile=0
EmbedManifestFile=1
DPIAware=1
AutoGenerateMenus=0
CompilerWarnings=1
Icon=UnitTesting.ico
[Compiler]
Platform=x64
64BitSuffix=64
32BitSuffix=
BeforeCompileProcessEnabled=0
AfterCompileProcessEnabled=0
[Version]
Include=0
AutoIncrementBuild=0
